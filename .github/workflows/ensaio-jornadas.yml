name: Portão de jornadas (ensaio)
# P11/R4: a mesma bateria do `node ensaio/rodar.mjs` (emuladores Firestore + Auth + Functions com as rules e as
# Functions do checkout, navegador real) roda em todo PR, em todo push no main e todo dia às 6h (BRT).
# Desktop e celular (390×844) em paralelo. Nunca toca o projeto real: o gancho só liga em 127.0.0.1?ensaio=1
# e o job não recebe nenhum secret.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # 06:00 em Brasília
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ensaio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jornadas:
    name: jornadas (${{ matrix.tela }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tela: [desktop, movel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache do emulador do Firestore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-ft15-v1
      - name: Firebase CLI e emulador
        run: |
          npm i -g firebase-tools@15 --no-audit --no-fund
          firebase setup:emulators:firestore
      - name: Dependências das Functions (sem lockfile no repo)
        working-directory: functions-get
        run: npm i --no-package-lock --no-audit --no-fund
      - name: Dependências do ensaio, navegador e SDK local
        working-directory: ensaio
        run: |
          npm i --no-audit --no-fund
          npx playwright install --with-deps chromium
          node montar-cdn.mjs
      - name: Bateria de jornadas
        run: node ensaio/rodar.mjs ${{ matrix.tela == 'movel' && '--movel' || '' }}
      - name: Fotos e logs do ensaio
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ensaio-${{ matrix.tela }}
          path: |
            ensaio/saida/
            ensaio/.runtime/*.log
          retention-days: 7
          if-no-files-found: warn
