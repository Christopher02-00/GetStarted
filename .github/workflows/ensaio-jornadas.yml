name: Portão de jornadas (ensaio)
# P11/R4: a mesma bateria do `node ensaio/rodar.mjs` (emuladores Firestore + Auth + Functions com as rules e as
# Functions do checkout, navegador real) roda em todo PR, em todo push no main e todo dia às 6h (BRT).
# Desktop e celular (390×844) em paralelo. Nunca toca o projeto real: o gancho só liga em 127.0.0.1?ensaio=1
# e o job não recebe nenhum secret.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # 06:00 em Brasília
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ensaio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jornadas:
    name: jornadas (${{ matrix.tela }}, ${{ matrix.fatia }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tela: [desktop, movel]
        # 19/11/2026 (velocidade): a bateria inteira levava 50–60 min em série. Duas fatias paralelas por tela,
        # cada uma com o próprio emulador: a = J01–J49; b = J50+ com as dependências J06/J55/J56 na frente.
        fatia: [a, b]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache do emulador do Firestore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-ft15-v1
      - name: Firebase CLI e emulador
        run: |
          npm i -g firebase-tools@15 --no-audit --no-fund
          firebase setup:emulators:firestore
      - name: Dependências das Functions (sem lockfile no repo)
        working-directory: functions-get
        run: npm i --no-package-lock --no-audit --no-fund
      - name: Dependências do ensaio, navegador e SDK local
        working-directory: ensaio
        run: |
          npm i --no-audit --no-fund
          npx playwright install --with-deps chromium
          node montar-cdn.mjs
      - name: Papéis iguais na tela e nas rules (CP225)
        run: node scripts/papeis-cp225.mjs
      - name: Bateria de jornadas (fatia)
        run: |
          if [ "${{ matrix.fatia }}" = a ]; then L=$(ls ensaio/jornadas/*.mjs | xargs -n1 basename | sort | awk '$0<"J50"' | paste -sd, -)
          else L=$( (ls ensaio/jornadas/*.mjs | xargs -n1 basename | sort | grep -E '^(J06|J55|J56)-'; ls ensaio/jornadas/*.mjs | xargs -n1 basename | sort | awk '$0>="J50"' | grep -vE '^(J55|J56)-') | paste -sd, -); fi
          echo "jornadas: $L"
          node ensaio/rodar.mjs ${{ matrix.tela == 'movel' && '--movel' || '' }} --jornadas "$L"
        env:
          ENSAIO_COBERTURA: ${{ matrix.tela == 'desktop' && '1' || '' }}
      - name: Cobertura desta fatia
        if: matrix.tela == 'desktop'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-${{ matrix.fatia }}
          path: ensaio/saida/cobertura.json
          retention-days: 3
      - name: Fotos e logs do ensaio
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ensaio-${{ matrix.tela }}-${{ matrix.fatia }}
          path: |
            ensaio/saida/
            ensaio/.runtime/*.log
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true  # ensaio/.runtime/*.log (OutOfMemoryError do emulador aparece aqui)
  cobertura:
    name: cobertura de cliques (P10)
    needs: jornadas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cobertura-*
          path: cob
      - name: Juntar as fatias e conferir
        run: |
          python3 - <<'PY'
          import json,glob,os
          tot={}
          for f in glob.glob('cob/*/cobertura.json'):
              for k,v in json.load(open(f)).items(): tot.setdefault(k,set()).update(v)
          os.makedirs('ensaio/saida',exist_ok=True)
          json.dump({k:sorted(v) for k,v in tot.items()},open('ensaio/saida/cobertura.json','w'),indent=1)
          print('fatias:',len(glob.glob('cob/*/cobertura.json')))
          PY
          for h in escritorio.html portal-cliente.html calendario.html; do python3 ferramentas/cobertura_handlers.py "$h"; done
