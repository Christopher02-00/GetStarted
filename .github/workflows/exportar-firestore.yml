name: R2 — exportar Firestore anonimizado (só leitura)
# Manual. Lê produção com a conta claude-site-get (Cloud Datastore Viewer), anonimiza e guarda como artefato do run
# (retido 3 dias, visível só a quem tem acesso ao repositório). Nunca grava no Firestore nem faz commit.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Exportar e anonimizar
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA" || { echo "::error::FIREBASE_SERVICE_ACCOUNT ausente"; exit 1; }
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i --no-save --silent google-auth-library@9
          node .github/scripts/exportar-firestore-anonimizado.mjs get-started-4956d
          tar -czf firestore-anonimizado.tar.gz exportacao && sha256sum firestore-anonimizado.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firestore-anonimizado
          path: firestore-anonimizado.tar.gz
          retention-days: 3
          if-no-files-found: error
