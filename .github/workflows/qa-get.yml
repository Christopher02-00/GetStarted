name: Get regression paths
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: get-rpr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: .qa-get/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Install locked test dependencies
        working-directory: .qa-get
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Four real module paths and five red controls
        working-directory: .qa-get
        run: npm test
