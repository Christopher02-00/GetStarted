name: Vigia da liberação (só leitura)
# CP240 (20/11/2026, depois de Fedalto e Stokki 2026-12). Duas vezes por dia, roda o próprio código do servidor (leitura do editor I172)
# como a Amanda em todo mês com pedido do cliente ou ajuste interno em andamento, com os dados reais e SÓ LEITURA
# (conta claude-site-get, Cloud Datastore Viewer; a transação do vigia recusa escrita).
# Vermelho = tudo aprovado e a Amanda sem botão de liberar, pedido sem saída ou editor que não abre → o run falha (o GitHub avisa por
# e-mail) e o resumo do run diz cliente, mês e motivo. Amarelo/verde só informam.
on:
  schedule:
    - cron: '23 12 * * *'   # 09:23 BRT
    - cron: '47 19 * * *'   # 16:47 BRT
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vigia-liberacao
  cancel-in-progress: false
jobs:
  vigia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Dependências das Functions (sem lockfile)
        run: cd functions-get && npm i --no-package-lock --no-audit --no-fund --silent
      - name: Vigiar (só leitura)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA" || { echo "::error::FIREBASE_SERVICE_ACCOUNT ausente"; exit 1; }
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node .github/scripts/vigia-liberacao.mjs
