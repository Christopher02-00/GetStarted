<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar Pedido · Get Started</title>
<style>
  :root{
    --graphite:#2C2D2F; --yellow:#FBBC19; --offwhite:#F0F1ED;
    --deep:#212123; --line:#3A3A3D; --muted:#8a8a8d; --paper:#26272a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--graphite);color:var(--offwhite);min-height:100vh;}
  .wrap{max-width:520px;margin:0 auto;padding:36px 18px 60px;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;margin-bottom:6px;}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--yellow);flex-shrink:0;}
  .rule{width:52px;height:5px;background:var(--yellow);border-radius:2px;margin:14px 0 10px 0;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;}
  h1 .y{color:var(--yellow);}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.5;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11.5px;font-weight:700;margin-bottom:6px;}
  .field input,.field textarea,.field select{width:100%;background:var(--deep);border:1px solid var(--line);border-radius:9px;color:#fff;padding:12px 13px;font-size:16px;font-family:inherit;}
  .field textarea{resize:vertical;min-height:90px;}
  .btn{width:100%;background:var(--yellow);color:var(--graphite);border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;}
  .btn:disabled{opacity:.5;}
  .status{display:none;text-align:center;padding:40px 20px;}
  .status.show{display:block;}
  .status .icon{font-size:44px;margin-bottom:14px;}
  .foot{margin-top:20px;text-align:center;color:var(--muted);font-size:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>Get Started</div>
  <div class="rule"></div>
  <h1>Central de <span class="y">ajustes</span></h1>
  <div class="sub">Descreva o que você precisa e envie seu pedido à equipe.</div>

  <form id="formPedido">
    <div class="card">
      <div class="field"><label>Seu nome / empresa</label><input type="text" id="clienteNome" required placeholder="Ex: Fior Restaurante"></div>
      <div class="field"><label>Sobre o que é o pedido?</label>
        <select id="tipoPedido">
          <option value="pedido_calendario">Calendário, roteiro e ajustes</option>
          <option value="pedido_legenda">Legenda de publicação</option>
          <option value="pedido_agendamento">Agendamento</option>
          <option value="pedido_geral">Equipe geral</option>
        </select>
      </div>
      <div class="field"><label>O que você precisa?</label><textarea id="pedidoDesc" required placeholder="Descreve seu pedido com detalhes..."></textarea></div>
      <div class="field"><label>É urgente? (afeta o prazo)</label>
        <select id="urgencia">
          <option value="normal">Normal (até o fim do dia útil seguinte)</option>
          <option value="hoje">Preciso ainda hoje</option>
        </select>
      </div>
    </div>
    <div id="pendenteCp152" role="status" hidden><p>Um envio anterior aguarda confirmação.</p><button type="button" class="btn" onclick="enviarPedidoPublicoCp152(true)">Confirmar envio pendente</button></div><button type="submit" class="btn" id="btnEnviar">Enviar pedido</button><p id="erroPedidoCp152" role="alert"></p>
  </form>

  <div class="status" id="status">
    <div class="icon">✅</div>
    <h2>Recebemos seu pedido!</h2>
    <div id="respostaPublicaCp183" aria-live="polite"></div><button type="button" class="btn" onclick="conferirRespostaPublicaCp183()">Conferir resposta da equipe</button>
    <p style="color:var(--muted);margin-top:8px;">Seu pedido foi registrado para acompanhamento pela equipe.</p>
  </div>

  <div class="foot">Get Started Produções</div>
</div>

<script type="module">
  import {htmlRespostaLegendaPublicaCp183} from './gs-resposta-legenda-publica-cp183.mjs?v=6a69535df05c98d2701f257defc857ed7811a34ac91deb6ae1a728c9797ab3be';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyvxHHInEQMpcNHKY__lj3T2G5cikGoyw",
    authDomain: "get-started-4956d.firebaseapp.com",
    projectId: "get-started-4956d",
    storageBucket: "get-started-4956d.firebasestorage.app",
    messagingSenderId: "27813235721",
    appId: "1:27813235721:web:38c8e840153e2ae3853cd8"
  };
  const app = initializeApp(firebaseConfig);
  /* 28/07/2026 — sem esta sessão as regras novas do Firestore recusam a
     gravação e o formulário quebra em silêncio. Login anônimo não
     identifica ninguém: só dá às regras algo em que se apoiar. */
  const auth=getAuth(app);
  const authPronta = signInAnonymously(auth).catch(e => { console.error('Falha na autenticação:', e); return null; });
  const db = getFirestore(app);

  function dataCivilPedidoCp152(agora=new Date()){
    const partes=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(agora).filter(p=>['year','month','day'].includes(p.type)).map(p=>[p.type,p.value]));
    return partes.year+'-'+partes.month+'-'+partes.day;
  }
  function proximaDataUtil(hoje){
    const [ano,mes,dia]=hoje.split('-').map(Number),d=new Date(Date.UTC(ano,mes-1,dia,12));
    do{d.setUTCDate(d.getUTCDate()+1);}while(d.getUTCDay()===0||d.getUTCDay()===6);
    return d.toISOString().slice(0,10);
  }
  const form=document.getElementById('formPedido'),btn=document.getElementById('btnEnviar'),erroPedido=document.getElementById('erroPedidoCp152'),painelPendente=document.getElementById('pendenteCp152');
  let enviandoPedidoCp152=false;
  const chavePedidoCp152=uid=>'get_publico_cp152:'+uid;
  async function hashPedidoPublicoCp152(payload){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(payload)));return [...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,'0')).join('');}
  async function lerPedidoPublicoCp152(uid){
    const raw=localStorage.getItem(chavePedidoCp152(uid));if(!raw)return null;
    const op=JSON.parse(raw),prefixo='publico_cp152_'+uid+'_';
    if(op.schema!==1||op.uid!==uid||typeof op.id!=='string'||!op.id.startsWith(prefixo)||!/^[a-f0-9]{32}$/.test(op.id.slice(prefixo.length))||await hashPedidoPublicoCp152(op.payload)!==op.hash)throw Error('A tentativa guardada precisa de conferência. Nenhum segundo pedido foi criado.');
    return op;
  }
  authPronta.then(async()=>{try{const uid=auth.currentUser?.uid;if(uid)painelPendente.hidden=!(await lerPedidoPublicoCp152(uid));}catch(e){erroPedido.textContent=e.message;}});
  const chaveRespostaPublicaCp183=uid=>'get_publico_cp183_ultimo:'+uid;
  window.conferirRespostaPublicaCp183=async function(){
    const cont=document.getElementById('respostaPublicaCp183');await authPronta;const uid=auth.currentUser?.uid||'',id=localStorage.getItem(chaveRespostaPublicaCp183(uid))||'',prefixo='publico_cp152_'+uid+'_';
    if(!uid||!id.startsWith(prefixo)||!/^[a-f0-9]{32}$/.test(id.slice(prefixo.length))){cont.textContent='O envio confirmado deste acesso ficará disponível para conferência aqui.';return;}
    try{const snap=await getDoc(doc(db,'pedidos_publicos',id));if(auth.currentUser?.uid!==uid)return;if(!snap.exists()||snap.data().autorUid!==uid||snap.data().protocoloCriacaoCp152!==id)throw Error('O pedido não foi confirmado neste acesso.');
      cont.innerHTML=htmlRespostaLegendaPublicaCp183(snap.data(),{cliente:String(snap.data().cliente||snap.data().clienteSlug||snap.data().slug||''),origemId:id})||'<p>A equipe ainda não disponibilizou uma resposta para este pedido.</p>';document.getElementById('status').classList.add('show');
    }catch(e){if(auth.currentUser?.uid===uid)cont.textContent='Não consegui conferir a resposta agora. Seu pedido foi preservado. Use Conferir resposta da equipe para tentar novamente.';}
  };
  authPronta.then(()=>{if(auth.currentUser?.uid&&localStorage.getItem(chaveRespostaPublicaCp183(auth.currentUser.uid)))void window.conferirRespostaPublicaCp183();});
  window.enviarPedidoPublicoCp152=async function(retomar=false){
    if(enviandoPedidoCp152)return;
    enviandoPedidoCp152=true;btn.disabled=true;btn.textContent='Conferindo…';erroPedido.textContent='';
    try{
      await authPronta;
      const uid=auth.currentUser?.uid||'';if(!uid)throw Error('Não consegui confirmar seu acesso. Tente novamente.');
      const conferir=()=>{if(auth.currentUser?.uid!==uid)throw Error('A sessão mudou. A tentativa anterior continua guardada.');};
      const valores=['clienteNome','pedidoDesc','tipoPedido','urgencia'].map(id=>document.getElementById(id).value.trim());
      const [clienteNome,descricao,tipo,urgencia]=valores,destinatario=({pedido_calendario:'Chris',pedido_legenda:'Chris',pedido_agendamento:'Cecília',pedido_geral:'Amanda'})[tipo];
      let op=await lerPedidoPublicoCp152(uid);conferir();
      if(!op){
        if(retomar)throw Error('Não há envio pendente para confirmar.');
        if(!clienteNome||!descricao||!destinatario)throw Error('Informe seu nome, o pedido e o assunto.');
        const hoje=dataCivilPedidoCp152(),prazoData=urgencia==='hoje'?hoje:proximaDataUtil(hoje);
        const payload={titulo:'Pedido de cliente: '+clienteNome,descricao,origem:'cliente',clienteNome,destinatario,tipo,prazoData,prazoHora:'19:00',status:'pendente',provaTexto:'',provaImagemUrl:''};
        op={schema:1,id:'publico_cp152_'+uid+'_'+crypto.randomUUID().replaceAll('-',''),uid,payload,valores,hash:await hashPedidoPublicoCp152(payload)};
        conferir();localStorage.setItem(chavePedidoCp152(uid),JSON.stringify(op));
      }else if(!retomar&&JSON.stringify(valores)!==JSON.stringify(op.valores))throw Error('Existe um envio anterior aguardando confirmação. Use Confirmar envio pendente; seu novo texto continua aqui.');
      painelPendente.hidden=false;
      const ref=doc(db,'pedidos_publicos',op.id);conferir();
      await runTransaction(db,async tx=>{
        const s=await tx.get(ref);conferir();
        if(s.exists()){
          const salvo=s.data();
          if(salvo.autorUid!==uid||salvo.protocoloCriacaoCp152!==op.id||Object.entries(op.payload).some(([k,v])=>salvo[k]!==v))throw Error('O recibo não corresponde ao pedido guardado. Nenhum registro foi sobrescrito.');
          return;
        }
        tx.set(ref,{...op.payload,autorUid:uid,protocoloCriacaoCp152:op.id,lido:false,viraDemanda:true,criadoEm:serverTimestamp()});
      });
      conferir();
      const atual=localStorage.getItem(chavePedidoCp152(uid));if(atual&&JSON.parse(atual).id===op.id)localStorage.removeItem(chavePedidoCp152(uid));
      painelPendente.hidden=true;
      const mesmos=['clienteNome','pedidoDesc','tipoPedido','urgencia'].every((id,i)=>document.getElementById(id).value.trim()===op.valores[i]);
      if(mesmos)form.style.display='none';
      else erroPedido.textContent='Pedido anterior confirmado. O novo texto que você digitou continua neste formulário.';
      try{localStorage.setItem(chaveRespostaPublicaCp183(uid),op.id);}catch{erroPedido.textContent='Pedido confirmado. Este aparelho não conseguiu guardar o atalho de acompanhamento.';}
      document.getElementById('status').classList.add('show');
      await window.conferirRespostaPublicaCp183();
    }catch(e){erroPedido.textContent='Não consegui confirmar o envio: '+(e.message||'tente novamente')+' Seu texto continua nesta tela. Se houver um envio pendente, use Confirmar envio pendente.';try{painelPendente.hidden=!localStorage.getItem(chavePedidoCp152(auth.currentUser?.uid||''));}catch{painelPendente.hidden=true;}}
    finally{enviandoPedidoCp152=false;btn.disabled=false;btn.textContent='Enviar pedido';}
  };
  form.addEventListener('submit',e=>{e.preventDefault();return window.enviarPedidoPublicoCp152(false);});
</script>
</body>
</html>
