# Get Started — o que NÃO deve ser publicado no site
#
# O GitHub Pages serve tudo que está no repositório. Sem este arquivo,
# qualquer pessoa abre get-started.agency/AGENTS.md e lê a arquitetura
# inteira do sistema, ou /firestore.rules e vê como o banco se defende.
#
# Nada aqui é credencial — ninguém entra no banco com estes arquivos.
# Mas juntos são um mapa de onde procurar, e isso não precisa ser público.
#
# Os arquivos CONTINUAM no repositório. Só param de ser servidos no site.
# O Codex e qualquer IA que trabalhe no repo seguem lendo normalmente.
#
# ── NÃO acrescente aqui, sem conferir antes ──────────────────────────
#   videos/      → 5 arquivos .mp4 usados no index.html (portfólio)
#   Planos.pdf   → catálogo comercial oficial; usado no site, perfil e nos dois momentos de avulso.html
#   Ambos são públicos de propósito. Excluir quebra o site.

exclude:
  - AGENTS.md                 # regras de trabalho para IAs — mapa do sistema
  - firestore.rules           # como o banco se defende
  - scripts/                  # suíte de testes atual
  - README.md
  - LICENSE
